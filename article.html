<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Published Articles</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="article-page-wrapper">
        
        <header class="page-header">
            <div class="header-container">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
                <h1>All Published Articles</h1>
                <p>Browse through all inspiring biographies and stories</p>
            </div>
        </header>

        <div class="filter-section">
            <div class="search-box-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="article-page-search" placeholder="Type name, keywords or tags to filter...">
            </div>
        </div>

        <main class="main-container">
            <div id="all-articles-grid" class="responsive-article-grid">
                </div>
        </main>

        <button class="scroll-top-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            ↑
        </button>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/articles";
        let localArticles = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadArticlesFromDB();
            setupGridSearch();
        });

        // ब्याकइन्डबाट सबै आर्टिकलहरू लोड गर्ने
        function loadArticlesFromDB() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    // नयाँ आर्टिकल (Latest ID) लाई सधैं माथि राख्ने
                    data.sort((a, b) => b.id - a.id);
                    localArticles = data;
                    renderArticlesGrid(localArticles);
                })
                .catch(err => {
                    console.error("Error connecting to backend database:", err);
                    document.getElementById('all-articles-grid').innerHTML = 
                        `<p style='text-align:center; width:100%; color:#ff6b6b; font-weight:600;'>
                            <i class="fas fa-exclamation-triangle"></i> Error: Database Server चल्दै छैन!
                         </p>`;
                });
        }

        // ग्रिड युआई रेन्डर गर्ने फङ्सन (Modern Organized Layout)
        function renderArticlesGrid(articles) {
            const grid = document.getElementById('all-articles-grid');
            grid.innerHTML = "";

            if (articles.length === 0) {
                grid.innerHTML = "<p style='text-align:center; width:100%; color:#cbdad2;'>No articles matching your search.</p>";
                return;
            }

            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = 'article-row-card';
                
                // हामीले अघि बनाएका स्मूथ होभर इफेक्टहरू यसमा पनि चल्नेछन्
                let hoverLogic = "";
                if (art.image2 && art.image2.trim() !== "") {
                    hoverLogic = `
                        onmouseover="const img = document.getElementById('grid-img-${art.id}'); img.style.opacity = '0.3'; setTimeout(() => { img.src='${art.image2}'; img.style.opacity = '1'; }, 150);"
                        onmouseout="const img = document.getElementById('grid-img-${art.id}'); img.style.opacity = '0.3'; setTimeout(() => { img.src='${art.image}'; img.style.opacity = '1'; }, 150);"
                    `;
                }

                card.innerHTML = `
                    <div class="row-card-img" ${hoverLogic}>
                        <img id="grid-img-${art.id}" src="${art.image}" alt="${art.title}">
                    </div>
                    <div class="row-card-info">
                        <span class="row-card-category"><i class="far fa-bookmark"></i> Biography</span>
                        <h2>${art.title}</h2>
                        <p class="row-card-summary">${art.summary || 'Click below to read the full details and history of this prominent figure.'}</p>
                        <div class="row-card-footer">
                            <span class="author-tag"><i class="far fa-user"></i> By ${art.author || 'Admin'}</span>
                            <span class="views-tag"><i class="far fa-eye"></i> ${art.views || 0} views</span>
                           <a href="index.html?id=${art.id}" class="row-read-more">Read Full Story →</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // रियल-टाइम सर्च फिल्टर लजिक
        function setupGridSearch() {
            const searchInput = document.getElementById('article-page-search');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = localArticles.filter(a => 
                    a.title.toLowerCase().includes(query) || 
                    (a.summary && a.summary.toLowerCase().includes(query)) ||
                    (a.author && a.author.toLowerCase().includes(query))
                );
                renderArticlesGrid(filtered);
            });
        }
    </script>
</body>
</html>
